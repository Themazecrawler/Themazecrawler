name: Update GNOME GitLab activity

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_gnome_activity.py
      - scripts/render_gnome_card.py
      - assets/gnome-stats-template.svg
      - .github/workflows/gnome-activity.yml

permissions:
  contents: write

concurrency:
  group: gnome-profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public GNOME activity
        run: python3 scripts/update_gnome_activity.py
      - name: Commit updated activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/gnome-stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GNOME GitLab activity'
            git push
          fi
